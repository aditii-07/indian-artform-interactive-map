<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Trails of India</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
    --bg-dark: #0b1310;
    --panel-bg: #121e19;
    --panel-border: rgba(30, 215, 148, 0.18);
    --card-bg: rgba(18, 30, 25, 0.85);
    --card-hover: #182822;
    --text-bright: #f0fdf4;
    --text-muted: #839d91;
    --emerald-main: #10b981;
    --emerald-light: #34d399;
    --emerald-glow: rgba(16, 185, 129, 0.35);
    --amber-gold: #f59e0b;
    --amber-glow: rgba(245, 158, 11, 0.4);
    --shadow-main: 0 10px 30px rgba(0, 0, 0, 0.5);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body, html {
    height: 100%;
    width: 100%;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-bright);
    overflow: hidden;
}

/* App Shell */
.app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    position: relative;
}

/* Header Navbar */
header {
    height: 64px;
    background: #090f0d;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--emerald-main), var(--amber-gold));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 12px var(--emerald-glow);
}

.brand-icon svg {
    fill: #000;
    width: 18px;
    height: 18px;
}

.brand-text h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: var(--text-bright);
    text-transform: uppercase;
}

.brand-text p {
    font-size: 0.72rem;
    color: var(--text-muted);
}

/* Header Tools */
.header-controls {
    display: flex;
    align-items: center;
    gap: 16px;
}

.search-box {
    position: relative;
    width: 280px;
}

.search-box input {
    width: 100%;
    background: #14221c;
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 7px 14px 7px 34px;
    color: var(--text-bright);
    font-size: 0.82rem;
    outline: none;
    transition: all 0.2s;
}

.search-box input:focus {
    border-color: var(--emerald-main);
    box-shadow: 0 0 10px var(--emerald-glow);
}

.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    stroke: var(--text-muted);
    fill: none;
}

/* Category Bar */
.filter-bar {
    height: 48px;
    background: #0d1713;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 10px;
    z-index: 90;
    overflow-x: auto;
}

.filter-chip {
    background: #14221c;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-muted);
    padding: 5px 14px;
    border-radius: 16px;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
}

.filter-chip:hover {
    color: var(--text-bright);
    border-color: var(--emerald-main);
}

.filter-chip.active {
    background: var(--emerald-main);
    color: #000;
    font-weight: 600;
    border-color: var(--emerald-main);
    box-shadow: 0 0 12px var(--emerald-glow);
}

/* Main Split View */
.main-view {
    display: flex;
    flex: 1;
    position: relative;
    overflow: hidden;
}

/* Sidebar List */
.sidebar {
    width: 400px;
    background: var(--panel-bg);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    z-index: 10;
}

.sidebar-header {
    padding: 12px 16px;
    background: #0e1a15;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--text-muted);
}

.cards-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* Custom Scrollbar */
.cards-container::-webkit-scrollbar {
    width: 5px;
}
.cards-container::-webkit-scrollbar-track {
    background: transparent;
}
.cards-container::-webkit-scrollbar-thumb {
    background: #1e332a;
    border-radius: 4px;
}

/* Art Location Card */
.art-card {
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    gap: 14px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
}

.art-card:hover {
    background: var(--card-hover);
    border-color: var(--emerald-main);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}

.art-card.active {
    border-color: var(--amber-gold);
    background: #1c2d25;
    box-shadow: 0 0 15px var(--amber-glow);
}

.art-card-thumb {
    width: 80px;
    height: 80px;
    min-width: 80px;
    min-height: 80px;
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    background: #080d0b;
}

.art-card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.card-state {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--emerald-light);
    margin-bottom: 2px;
}

.card-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--text-bright);
    font-weight: 700;
    margin-bottom: 3px;
}

.card-tradition {
    font-size: 0.82rem;
    color: var(--amber-gold);
    margin-bottom: 6px;
}

.card-desc-short {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.action-btn {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
}

.art-card:hover .action-btn {
    color: var(--text-bright);
}

.story-link {
    color: var(--amber-gold) !important;
}

/* Map Container */
#map {
    flex: 1;
    height: 100%;
    width: 100%;
    background: #070d0b;
}

/* Custom Marker Styling */
.marker-pin-outer {
    width: 22px;
    height: 22px;
    background: rgba(16, 185, 129, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
}

.marker-pin-inner {
    width: 12px;
    height: 12px;
    background: var(--emerald-main);
    border: 2px solid #070d0b;
    border-radius: 50%;
    box-shadow: 0 0 10px var(--emerald-main);
}

.marker-pin-outer.selected {
    background: rgba(245, 158, 11, 0.3);
    transform: scale(1.4);
}

.marker-pin-outer.selected .marker-pin-inner {
    background: var(--amber-gold);
    box-shadow: 0 0 14px var(--amber-gold);
}

/* Leaflet Popup Override */
.leaflet-popup-content-wrapper {
    background: #111d17 !important;
    color: var(--text-bright) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 12px !important;
    box-shadow: var(--shadow-main) !important;
    padding: 0 !important;
}

.leaflet-popup-tip {
    background: #111d17 !important;
}

.leaflet-popup-content {
    margin: 12px 14px !important;
    width: 210px !important;
}

.popup-card-state {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--emerald-light);
    text-transform: uppercase;
}

.popup-card-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-bright);
    margin: 2px 0 2px 0;
}

.popup-card-tradition {
    font-size: 0.8rem;
    color: var(--amber-gold);
    margin-bottom: 8px;
}

.popup-card-btn {
    width: 100%;
    background: var(--emerald-main);
    color: #000;
    font-weight: 700;
    font-size: 0.75rem;
    border: none;
    padding: 6px 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
    text-align: center;
}

.popup-card-btn:hover {
    background: var(--emerald-light);
}

/* CRITICAL FIX: High Z-Index Modal Overlay */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 10, 8, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999; /* Higher than map layers & controls */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.modal-container {
    width: 90%;
    max-width: 680px;
    max-height: 85vh;
    background: #121e19;
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    overflow-y: auto;
    position: relative;
    transform: translateY(20px);
    transition: transform 0.3s ease;
}

.modal-overlay.open .modal-container {
    transform: translateY(0);
}

.modal-close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: background 0.2s;
}

.modal-close-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

.modal-banner {
    width: 100%;
    height: 240px;
    object-fit: cover;
    background: #080d0b;
}

.modal-body {
    padding: 24px;
}

.modal-state {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--emerald-light);
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

.modal-title {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: var(--text-bright);
    margin: 4px 0;
}

.modal-tradition {
    font-size: 1.05rem;
    color: var(--amber-gold);
    font-weight: 600;
    margin-bottom: 16px;
}

.modal-description {
    font-size: 0.95rem;
    line-height: 1.65;
    color: #c3d4cc;
    margin-bottom: 24px;
}

.modal-meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    background: #0a130f;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
}

.meta-item label {
    display: block;
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
}

.meta-item span {
    font-size: 0.85rem;
    color: var(--text-bright);
    font-weight: 600;
}

@media (max-width: 768px) {
    .main-view {
        flex-direction: column-reverse;
    }
    .sidebar {
        width: 100%;
        height: 40%;
    }
    #map {
        height: 60%;
    }
    .search-box {
        width: 160px;
    }
}
</style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 19h20L12 2zm0 4l6.5 11h-13L12 6z"/></svg>
            </div>
            <div class="brand-text">
                <h1>Art Trails of India</h1>
                <p>Explore living art traditions across states</p>
            </div>
        </div>

        <div class="header-controls">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search art, state, region...">
            </div>
        </div>
    </header>

    <div class="filter-bar">
        <button class="filter-chip active" data-cat="all">All Traditions</button>
        <button class="filter-chip" data-cat="Paintings">Paintings</button>
        <button class="filter-chip" data-cat="Metal & Crafts">Metal & Crafts</button>
        <button class="filter-chip" data-cat="Textiles & Toys">Textiles & Toys</button>
    </div>

    <div class="main-view">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span id="resultCount">Displaying locations...</span>
                <span>Click card to locate</span>
            </div>
            <div class="cards-container" id="cardsContainer"></div>
        </aside>

        <main id="map"></main>
    </div>
</div>

<!-- Modal Dialog (Z-Index Fixed) -->
<div class="modal-overlay" id="storyModal">
    <div class="modal-container">
        <button class="modal-close-btn" id="modalClose">&times;</button>
        <img class="modal-banner" id="modalImg" src="" alt="Art detail">
        <div class="modal-body">
            <div class="modal-state" id="modalState">State</div>
            <h2 class="modal-title" id="modalTitle">Title</h2>
            <div class="modal-tradition" id="modalTradition">Tradition</div>
            <p class="modal-description" id="modalDesc">Description</p>
            <div class="modal-meta-grid">
                <div class="meta-item">
                    <label>Coordinates</label>
                    <span id="modalCoords">0, 0</span>
                </div>
                <div class="meta-item">
                    <label>Craft Type</label>
                    <span id="modalCategory">Category</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// App State
let currentCategory = 'all';
let searchQuery = '';
let activeLocationId = null;
const markerMap = new Map();

// Initialize Map
const map = L.map('map', { zoomControl: true }).setView([22.5, 79.0], 5);

// Add OpenStreetMap base tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Render List Cards
function renderCards() {
    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    const filtered = places.filter(p => {
        const matchesCat = currentCategory === 'all' || p.category === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery) ||
                              p.state.toLowerCase().includes(searchQuery) ||
                              p.tradition.toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
    });

    document.getElementById('resultCount').innerText = `${filtered.length} of ${places.length} locations shown`;

    filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = `art-card ${p.id === activeLocationId ? 'active' : ''}`;
        card.innerHTML = `
            <img class="art-card-thumb" src="${p.img}" alt="${p.tradition}" onerror="this.src='https://via.placeholder.com/70?text=Art'">
            <div class="art-card-content">
                <div class="card-state">${p.state}</div>
                <div class="card-title">${p.name}</div>
                <div class="card-tradition">${p.tradition}</div>
                <div class="card-desc-short">${p.description}</div>
                <div class="card-actions">
                    <button class="action-btn" onclick="locateOnMap(${p.id})">📍 Locate</button>
                    <button class="action-btn story-link" onclick="openStoryModal(${p.id})">Heritage Story &rsaquo;</button>
                </div>
            </div>
        `;

        card.addEventListener('click', (e) => {
            if (!e.target.classList.contains('action-btn')) {
                locateOnMap(p.id);
            }
        });

        container.appendChild(card);
    });
}

// Custom Marker Generator
function createMarkerIcon(isSelected = false) {
    return L.divIcon({
        className: 'custom-marker',
        html: `
            <div class="marker-pin-outer ${isSelected ? 'selected' : ''}">
                <div class="marker-pin-inner"></div>
            </div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });
}

// Add Markers to Map
function renderMarkers() {
    // Clear existing
    markerMap.forEach(m => map.removeLayer(m));
    markerMap.clear();

    places.forEach(p => {
        const marker = L.marker([p.lat, p.lng], {
            icon: createMarkerIcon(p.id === activeLocationId)
        }).addTo(map);

        const popupHTML = `
            <div>
                <div class="popup-card-state">${p.state}</div>
                <div class="popup-card-title">${p.name}</div>
                <div class="popup-card-tradition">${p.tradition}</div>
                <button class="popup-card-btn" onclick="openStoryModal(${p.id})">Read Heritage Story &rarr;</button>
            </div>
        `;

        marker.bindPopup(popupHTML);

        marker.on('click', () => {
            setActiveLocation(p.id, false);
        });

        markerMap.set(p.id, marker);
    });
}

// Locate Item
function locateOnMap(id) {
    setActiveLocation(id, true);
}

function setActiveLocation(id, panTo = true) {
    activeLocationId = id;

    // Reset markers styling
    markerMap.forEach((m, mId) => {
        m.setIcon(createMarkerIcon(mId === id));
    });

    const target = places.find(p => p.id === id);
    if (target && panTo) {
        map.flyTo([target.lat, target.lng], 7, { duration: 1.2 });
        const marker = markerMap.get(id);
        if (marker) marker.openPopup();
    }

    renderCards();
}

// Open Story Modal (Z-Index Fixed)
function openStoryModal(id) {
    const item = places.find(p => p.id === id);
    if (!item) return;

    document.getElementById('modalImg').src = item.img;
    document.getElementById('modalState').innerText = item.state;
    document.getElementById('modalTitle').innerText = item.name;
    document.getElementById('modalTradition').innerText = item.tradition;
    document.getElementById('modalDesc').innerText = item.description;
    document.getElementById('modalCoords').innerText = `${item.lat}°N, ${item.lng}°E`;
    document.getElementById('modalCategory').innerText = item.category;

    const modal = document.getElementById('storyModal');
    modal.classList.add('open');
}

// Modal Close Handlers
document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('storyModal').classList.remove('open');
});

document.getElementById('storyModal').addEventListener('click', (e) => {
    if (e.target.id === 'storyModal') {
        document.getElementById('storyModal').classList.remove('open');
    }
});

// Category Filter Controller
document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentCategory = chip.dataset.cat;
        renderCards();
    });
});

// Search Controller
document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderCards();
});

// Initialize App
renderMarkers();
renderCards();
</script>
